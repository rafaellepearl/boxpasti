# Publishes the site to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# It stamps index.html and app.js with the commit id, so phones never pair
# a cached page with a newer script after a deploy (see BUILD in app.js).
# Only the three site files are published; README, docs and supabase/ stay in the repo only.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build the site folder
        run: |
          v="${GITHUB_SHA::8}"
          mkdir _site
          cp index.html app.js style.css _site/
          sed -i "s/__VERSION__/$v/g" _site/index.html _site/app.js
          # Fail the deploy rather than publish a page and script that don't match.
          test "$(grep -c "$v" _site/index.html)" -eq 3
          grep -q "const BUILD = '$v';" _site/app.js

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
